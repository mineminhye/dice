<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주사위 확률 시뮬레이션 (큰 수의 법칙)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .canvas-container { position: relative; height: 350px; width: 100%; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- 헤더 영역 -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-700 mb-2">주사위 확률 시뮬레이션</h1>
            <p class="text-slate-600 text-lg font-medium">시행 횟수가 늘어남에 따라 상대도수가 수학적 확률 $1/6$에 수렴하는 '큰 수의 법칙'을 탐구해 보세요.</p>
        </header>

        <!-- 상단 대시보드 (통계 및 주사위) -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-10">
            <!-- 주사위 및 컨트롤 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center justify-center">
                <div id="dice-face" class="w-24 h-24 bg-indigo-600 rounded-2xl shadow-xl flex items-center justify-center text-white text-5xl font-bold mb-6 transition-transform duration-100 ease-out">
                    ?
                </div>
                <div class="grid grid-cols-2 gap-2 w-full">
                    <button id="roll-1" class="bg-indigo-600 text-white py-2 px-4 rounded-lg font-bold hover:bg-indigo-700 active:scale-95 transition">1회</button>
                    <button id="roll-10" class="bg-slate-800 text-white py-2 px-4 rounded-lg font-bold hover:bg-slate-900 active:scale-95 transition">10회</button>
                    <button id="roll-100" class="bg-slate-800 text-white py-2 px-4 rounded-lg font-bold hover:bg-slate-900 active:scale-95 transition">100회</button>
                    <button id="roll-1000" class="bg-rose-600 text-white py-2 px-4 rounded-lg font-bold hover:bg-rose-700 active:scale-95 transition">1000회</button>
                </div>
                <button id="reset-btn" class="mt-4 text-slate-400 hover:text-rose-600 text-sm font-medium underline">시뮬레이션 초기화</button>
            </div>

            <!-- 통계 현황 -->
            <div class="lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800">실시간 통계 현황</h2>
                    <div class="text-indigo-600 font-bold bg-indigo-50 px-4 py-1 rounded-full">총 시행 횟수: <span id="total-rolls">0</span>회</div>
                </div>
                <div class="grid grid-cols-3 md:grid-cols-6 gap-4">
                    <!-- 각 눈별 통계 카드 -->
                    <template id="stat-card-template">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                            <div class="text-sm font-bold text-slate-500 mb-1"><span class="face-num"></span>의 눈</div>
                            <div class="text-xl font-bold text-slate-800 face-count">0</div>
                            <div class="text-xs font-medium text-indigo-500 mt-1 face-ratio">0.0%</div>
                        </div>
                    </template>
                    <div id="stats-container" class="contents"></div>
                </div>
            </div>
        </div>

        <!-- 하단 그래프 영역 -->
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <!-- 막대 그래프 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                    <span class="w-2 h-6 bg-indigo-500 rounded-full mr-2"></span>
                    주사위 눈의 분포 (도수)
                </h3>
                <div class="canvas-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <!-- 선 그래프 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                    <span class="w-2 h-6 bg-emerald-500 rounded-full mr-2"></span>
                    상대도수의 수렴 (수학적 확률 1/6)
                </h3>
                <div class="canvas-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 데이터 상태 ---
        let totalRolls = 0;
        let faceCounts = [0, 0, 0, 0, 0, 0]; // 1~6 눈의 도수
        let relativeFreqHistory = [[], [], [], [], [], []]; // 선그래프용 기록
        let rollLabels = []; // X축 레이블
        
        const THEORETICAL_PROB = 1/6;
        const colors = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];

        // --- DOM 요소 ---
        const totalRollsEl = document.getElementById('total-rolls');
        const diceFaceEl = document.getElementById('dice-face');
        const statsContainer = document.getElementById('stats-container');
        const statCardTemplate = document.getElementById('stat-card-template');

        // 초기 통계 카드 생성
        for (let i = 1; i <= 6; i++) {
            const clone = statCardTemplate.content.cloneNode(true);
            clone.querySelector('.face-num').textContent = i;
            clone.querySelector('.face-count').id = `count-${i}`;
            clone.querySelector('.face-ratio').id = `ratio-${i}`;
            statsContainer.appendChild(clone);
        }

        // --- 차트 설정 ---
        const barCtx = document.getElementById('barChart').getContext('2d');
        const barChart = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: ['1', '2', '3', '4', '5', '6'],
                datasets: [{
                    label: '나온 횟수',
                    data: faceCounts,
                    backgroundColor: 'rgba(99, 102, 241, 0.7)',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { display: false } },
                    x: { grid: { display: false } }
                }
            }
        });

        const lineCtx = document.getElementById('lineChart').getContext('2d');
        const lineChart = new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: rollLabels,
                datasets: [
                    ...[1, 2, 3, 4, 5, 6].map((num, i) => ({
                        label: `${num}의 눈`,
                        data: relativeFreqHistory[i],
                        borderColor: colors[i],
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.2
                    })),
                    {
                        label: '수학적 확률 (1/6)',
                        data: [],
                        borderColor: '#64748b',
                        borderDash: [5, 5],
                        borderWidth: 2,
                        pointRadius: 0,
                        order: -1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { 
                        min: 0, 
                        max: 0.4, 
                        ticks: { stepSize: 0.05 },
                        title: { display: true, text: '상대도수' }
                    },
                    x: { title: { display: true, text: '시행 횟수' } }
                },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } }
                }
            }
        });

        // --- 기능 함수 ---
        function roll(times) {
            let lastFace = 0;
            for (let i = 0; i < times; i++) {
                const face = Math.floor(Math.random() * 6) + 1;
                faceCounts[face - 1]++;
                totalRolls++;
                lastFace = face;

                // 데이터가 너무 많으면 브라우저가 느려지므로 샘플링 (X축 간격 조정)
                let sampleRate = 1;
                if (totalRolls > 100) sampleRate = 5;
                if (totalRolls > 500) sampleRate = 20;
                if (totalRolls > 2000) sampleRate = 100;

                if (totalRolls % sampleRate === 0 || totalRolls === 1) {
                    rollLabels.push(totalRolls);
                    for (let j = 0; j < 6; j++) {
                        relativeFreqHistory[j].push(faceCounts[j] / totalRolls);
                    }
                    lineChart.data.datasets[6].data.push(THEORETICAL_PROB);
                }
            }
            
            updateUI(lastFace);
        }

        function updateUI(lastFace) {
            // 주사위 시각 효과
            if (lastFace) {
                diceFaceEl.textContent = lastFace;
                diceFaceEl.classList.add('scale-90');
                setTimeout(() => diceFaceEl.classList.remove('scale-90'), 100);
            }

            // 통계 텍스트 업데이트
            totalRollsEl.textContent = totalRolls.toLocaleString();
            for (let i = 1; i <= 6; i++) {
                const count = faceCounts[i - 1];
                const ratio = totalRolls > 0 ? (count / totalRolls * 100).toFixed(1) : "0.0";
                document.getElementById(`count-${i}`).textContent = count.toLocaleString();
                document.getElementById(`ratio-${i}`).textContent = `${ratio}%`;
            }

            // 차트 업데이트
            barChart.data.datasets[0].data = [...faceCounts];
            barChart.update('none'); // 애니메이션 없이 빠르게 업데이트
            lineChart.update('none');
        }

        function reset() {
            totalRolls = 0;
            faceCounts = [0, 0, 0, 0, 0, 0];
            relativeFreqHistory.forEach(arr => arr.length = 0);
            rollLabels.length = 0;
            lineChart.data.datasets[6].data = [];
            diceFaceEl.textContent = '?';
            updateUI();
        }

        // --- 이벤트 리스너 ---
        document.getElementById('roll-1').addEventListener('click', () => roll(1));
        document.getElementById('roll-10').addEventListener('click', () => roll(10));
        document.getElementById('roll-100').addEventListener('click', () => roll(100));
        document.getElementById('roll-1000').addEventListener('click', () => roll(1000));
        document.getElementById('reset-btn').addEventListener('click', reset);

        // 초기화
        updateUI();

    </script>
</body>
</html>
